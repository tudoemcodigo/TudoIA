# Release: ao empurrar uma tag vX.Y.Z, constrói o TudoIA-Setup.exe no CI (build auditável, não o da máquina de
# alguém), confere versão e testes, atesta a proveniência e anexa o .exe e o .sha256 à release do GitHub.
# O .exe não é assinado digitalmente (ver docs/instalador.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  empacotar:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write       # criar a release e anexar os arquivos
      id-token: write       # atestado de proveniência
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: uv
        run: python -m pip install "uv==0.13.0"
      - name: Versão da tag, do pyproject e do instalador precisam ser a mesma
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "tag '$env:TAG' fora do formato vX.Y.Z" }
          $tag = $Matches[1]
          $proj = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $inst = (Select-String -Path instalador/tudoia_instalador/__init__.py -Pattern '^VERSAO = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $proj -or $tag -ne $inst) { throw "versões divergem: tag=$tag pyproject=$proj instalador=$inst" }
      - name: Dependências
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Testes
        run: uv run --frozen pytest -q
      - name: Construir o instalador
        run: uv run --frozen python -m scripts.empacotar.construir
      - name: Conferir o checksum
        shell: pwsh
        run: |
          $esperado = (Get-Content dist/TudoIA-Setup.exe.sha256).Split(' ')[0]
          $real = (Get-FileHash dist/TudoIA-Setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($esperado -ne $real) { throw "sha256 não confere: $esperado != $real" }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/TudoIA-Setup.exe
      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG dist/TudoIA-Setup.exe dist/TudoIA-Setup.exe.sha256 `
            --title "TudoIA $env:TAG" --generate-notes --verify-tag
