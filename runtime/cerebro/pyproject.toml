[project]
name = "tudoia-cerebro"
version = "0.1.0"
description = "Cérebro local do TudoIA: memória, índice de documentos e ferramentas MCP"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.28",
    "numpy>=2.0",
    "trafilatura>=2.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "cryptography>=50.0.2",
    "joserfc>=1.7.7",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cerebro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
