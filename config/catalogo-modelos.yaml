provedores:
  nvidia:
    nome: NVIDIA NIM
    tier: FREE
    chave: NVIDIA_NIM_API_KEY
    site_chave: https://build.nvidia.com
    api_base: os.environ/NVIDIA_NIM_API_BASE
    url_modelos: https://integrate.api.nvidia.com/v1/models
    limites:
      rpm: 40
    fonte_limites: fóruns NVIDIA (mai–ago/2026); sem página oficial; a API não informa
      uso
    modelos: []
  openrouter:
    nome: OpenRouter (:free)
    tier: FREE
    chave: OPENROUTER_API_KEY
    site_chave: https://openrouter.ai/keys
    url_modelos: https://openrouter.ai/api/v1/models
    limites:
      rpm: 20
      rpd: 50
      usd_dia: 1
      reset: utc
    fonte_limites: openrouter.ai/docs/api-reference/limits (50/dia com menos de 10
      créditos; 1000/dia com 10 ou mais)
    modelos: []
  groq:
    nome: Groq
    tier: FREE
    chave: GROQ_API_KEY
    descartar_params:
    - prompt_cache_key
    site_chave: https://console.groq.com/keys
    url_modelos: https://api.groq.com/openai/v1/models
    limites:
      rpm: 30
      rpd: 1000
      reset: utc
    fonte_limites: 'console.groq.com/docs/rate-limits (por modelo; gpt-oss-120b: 30
      RPM, 1K RPD, 200K TPD)'
    modelos: []
  gemini:
    nome: Google Gemini (AI Studio)
    tier: FREE
    chave: GEMINI_API_KEY
    descartar_params:
    - prompt_cache_key
    - cached_content
    - cache_control
    site_chave: https://aistudio.google.com/apikey
    url_modelos: https://generativelanguage.googleapis.com/v1beta/models
    limites: {}
    fonte_limites: 'valores só em aistudio.google.com/rate-limit (relatos: ~20 pedidos/dia
      nos Flash 3.x). ⚠ plano grátis usa os dados para treino'
    modelos: []
  cloudflare:
    nome: Cloudflare Workers AI
    tier: FREE
    chave: CLOUDFLARE_API_KEY
    chaves_extras:
    - CLOUDFLARE_ACCOUNT_ID
    site_chave: https://dash.cloudflare.com
    url_modelos: https://api.cloudflare.com/client/v4/accounts/{CLOUDFLARE_ACCOUNT_ID}/ai/models/search
    limites:
      neurons_dia: 10000
      reset: utc
    fonte_limites: developers.cloudflare.com/workers-ai/platform/pricing
    modelos: []
  anthropic:
    nome: Anthropic (Claude)
    tier: PAID
    chave: ANTHROPIC_API_KEY
    site_chave: https://console.anthropic.com
    url_modelos: https://api.anthropic.com/v1/models
    limites: {}
    fonte_limites: 'US$ por milhão de tokens (entrada/saída): Sonnet 2/10, Opus 4/20,
      Haiku 0,10/0,50'
    modelos: []
  openai:
    nome: OpenAI (GPT)
    tier: PAID
    chave: OPENAI_API_KEY
    site_chave: https://platform.openai.com/api-keys
    url_modelos: https://api.openai.com/v1/models
    limites: {}
    fonte_limites: 'US$ por milhão de tokens: gpt-6.1-sol 2/10, gpt-6-luna 0,10/0,50'
    modelos: []
  deepseek:
    nome: DeepSeek
    tier: PAID
    chave: DEEPSEEK_API_KEY
    site_chave: https://platform.deepseek.com/api_keys
    url_modelos: https://api.deepseek.com/models
    limites: {}
    fonte_limites: api-docs.deepseek.com/quick_start/pricing (muito barato; mais barato
      fora do pico)
    modelos: []
  xai:
    nome: xAI (Grok)
    tier: PAID
    chave: XAI_API_KEY
    site_chave: https://console.x.ai
    url_modelos: https://api.x.ai/v1/models
    limites: {}
    fonte_limites: docs.x.ai/docs/models (grok-4.7 US$ 2/6)
    modelos: []
  huggingface:
    nome: Hugging Face Inference Providers
    tier: PAID
    chave: HF_TOKEN
    site_chave: https://huggingface.co/settings/tokens
    url_modelos: https://router.huggingface.co/v1/models
    limites: {}
    fonte_limites: huggingface.co/docs/inference-providers/pricing (conta free sem
      créditos mensais)
    modelos: []
