perfis:
  # Perfil = nome de modelo que o cliente escolhe (Claude Code, Open WebUI...). Detalhes em docs/componentes/roteador.md.
  # nuvem: false = nunca sai da máquina: grupos só locais, sem fallback, e o hook falha alto se algo contradisser isso.
  local-estrito:
    modelo: tudoia-local-estrito
    nuvem: false
    marcadores: [local]
    categorias:
      chat: tudoia-local-estrito
      rapido: tudoia-local-estrito
      raciocinio: tudoia-local-estrito
      codigo: tudoia-local-estrito-agente
      agente: tudoia-local-estrito-agente
  # hibrido = local primeiro; nuvem GRATUITA como apoio (Ollama fora, GPU ocupada, pedido maior que o contexto local,
  # imagem, #nuvem). Pago nunca: só pelo nome tudoia-max.
  hibrido:
    modelo: tudoia-hibrido
    nuvem: true
    marcadores: [local, nuvem]
    categorias:
      chat: tudoia-local
      rapido: tudoia-local
      raciocinio: tudoia-local
      codigo: tudoia-local-agente
      agente: tudoia-local-agente
      visao: tudoia-visao
    nuvem_categorias:
      chat: tudoia-nuvem
      rapido: tudoia-nuvem
      raciocinio: tudoia-nuvem
      codigo: tudoia-codigo
      agente: tudoia-codigo
      visao: tudoia-visao
