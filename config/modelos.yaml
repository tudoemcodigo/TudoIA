# Manifesto dos modelos de IA do TudoIA. Os pesos NAO vao no projeto: cada maquina baixa os seus.
# Documentacao: docs/componentes/modelos.md. Validado por scripts/modelos/baixar.py (--listar / --verificar).
#
# Campos de cada entrada:
#   id               identificador unico (minusculas, digitos, '.', '_', '-')
#   tipo             ollama | url | huggingface | comfyui-node-asset
#   destino          caminho RELATIVO a pasta base (padrao <repo>/modelos, ou variavel TUDOIA_MODELOS_DIR)
#   origem           ollama: 'nome:tag' | url/comfyui-node-asset: https://... | huggingface: 'dono/repo' (com 'arquivo')
#                    null = PENDENTE (a entrada existe, mas nao e baixada)
#   arquivo          so huggingface: caminho do arquivo dentro do repositorio
#   revisao          so huggingface: branch, tag ou commit (padrao main; prefira fixar um commit)
#   tamanho_aprox_gb estimativa para checar espaco livre antes do download (null = desconhecido)
#   licenca          {nome, url}: null quando nao confirmado
#   obrigatorio      true = entra em --obrigatorios
#   usado_por        onde o TudoIA usa o modelo
#   sha256           64 hex minusculos quando conhecido; null = so presenca/tamanho sao verificados
#   notas            texto livre; origem null exige 'PENDENTE: informar origem' aqui
#
# Regras impostas pelo carregador: https apenas; destino sem '..' nem caminho absoluto; ids unicos.
# HF_TOKEN (variavel de ambiente) so vai para huggingface.co; nunca fica no manifesto.

